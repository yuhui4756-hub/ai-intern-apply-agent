name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app tests evals
      - name: Run offline Agent quality evaluation
        run: python -m evals.run_agent_quality_eval --strict
      - name: Run test suite
        run: python -m pytest -q
